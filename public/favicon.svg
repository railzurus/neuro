<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Луна из hero-блока на главной (иконка Moon из lucide).
    В шапке она нарисована контуром на белом круге, но на 16 px тонкий штрих
    расплывается, поэтому здесь: фирменный круг + залитый силуэт луны.
  -->
  <circle cx="16" cy="16" r="16" fill="#c05b3a"/>
  <!-- scale(1.15) — чтобы силуэт занимал ~65% круга и читался на 16 px -->
  <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" fill="#fff" transform="translate(2.2 2.2) scale(1.15)"/>
</svg>
