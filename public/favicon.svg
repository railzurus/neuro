<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Фирменный круг + наушники из hero-блока (иконка Headphones из lucide).
    Градиент тот же, что у кнопок и шара на странице прослушивания
    (см. .btn-primary в src/index.css).

    Штрих утолщён с 2 до 3.6: у lucide он рассчитан на 24 px, а на 16 px
    исходная толщина истончается до трети пикселя и пропадает.
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6700"/>
      <stop offset="1" stop-color="#ff9445"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="16" fill="url(#brand)"/>
  <g
    transform="translate(5.2 5.2) scale(0.9)"
    fill="none"
    stroke="#fff"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>
  </g>
</svg>
